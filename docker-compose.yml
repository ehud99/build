services:
  db:
    image: postgres:16
    container_name: real-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: build_dev
    ports:
      # Host 5434 -> contenedor 5432 (5433 lo usa forge en la misma PC).
      - "5434:5432"
    volumes:
      # Volumen con nombre (no una carpeta de Windows): Postgres necesita permisos POSIX.
      - real_pgdata:/var/lib/postgresql/data

volumes:
  real_pgdata:
